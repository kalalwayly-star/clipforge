
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - ClipForge</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Clip<span>Forge</span></a>
        <a href="register.html" class="btn btn-primary">Create Account</a>
    </div>
</header>

<main class="section">
    <div class="container" style="max-width:460px;">

        <div class="section-heading">
            <h2>Welcome Back</h2>
            <p>Log in to continue creating videos with ClipForge.</p>
        </div>

        <form id="loginForm"
              style="background:white; padding:30px; border:1px solid #e5e7eb; border-radius:14px; box-shadow:0 12px 35px rgba(16,24,40,.08);">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                style="width:100%; padding:13px; margin:8px 0 18px; border:1px solid #d0d5dd; border-radius:8px;"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
                placeholder="Your password"
                style="width:100%; padding:13px; margin:8px 0 20px; border:1px solid #d0d5dd; border-radius:8px;"
            >

            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary"
                style="width:100%; border:0;"
            >
                Log In
            </button>

            <p id="loginMessage"
               role="status"
               aria-live="polite"
               style="margin-top:16px; text-align:center;">
            </p>

            <p style="text-align:center; margin-top:20px; font-size:14px;">
                Don't have an account?
                <a href="register.html" style="color:#2563eb; font-weight:bold;">
                    Create one
                </a>
            </p>

        </form>
    </div>
</main>

<script type="module">
import { auth } from "./js/firebase-config.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("loginMessage");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";
    message.textContent = "";
    message.style.color = "#dc2626";

    try {
        await signInWithEmailAndPassword(auth, email, password);

        message.style.color = "#15803d";
        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch (error) {
        const messages = {
            "auth/invalid-credential": "Incorrect email or password.",
            "auth/user-not-found": "No account found with this email.",
            "auth/wrong-password": "Incorrect email or password.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/too-many-requests": "Too many attempts. Please try again later.",
            "auth/network-request-failed": "Network error. Please try again."
        };

        message.textContent =
            messages[error.code] || "Login failed. Please try again.";

        button.disabled = false;
        button.textContent = "Log In";
    }
});
</script>

</body>
</html>
